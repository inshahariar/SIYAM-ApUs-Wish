<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday! 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'Segoe UI', Roboto, Arial, sans-serif; }

  /* ---------- SLIDES ---------- */
  .slide {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transform: translateX(50px) scale(.98);
    transition: opacity .6s ease, transform .6s ease, visibility .6s;
    padding: 20px;
  }
  .slide.active { opacity: 1; visibility: visible; transform: none; }

  /* ---------- COLOURFUL MOVING SHADOW BLOBS ---------- */
  .blobs { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .blobs i { position: absolute; border-radius: 50%; filter: blur(55px); opacity: .5; }
  .blobs i:nth-child(1) { width: 290px; height: 290px; background: #ff5e8a; top: -70px; left: -70px; animation: drift1 13s ease-in-out infinite alternate; }
  .blobs i:nth-child(2) { width: 250px; height: 250px; background: #ffd43b; bottom: -60px; right: -50px; animation: drift2 16s ease-in-out infinite alternate; }
  .blobs i:nth-child(3) { width: 210px; height: 210px; background: #4dabf7; bottom: 8%; left: -60px; animation: drift3 18s ease-in-out infinite alternate; }
  .blobs i:nth-child(4) { width: 190px; height: 190px; background: #b197fc; top: 4%; right: 6%; animation: drift1 15s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(95px, 65px) scale(1.18); } }
  @keyframes drift2 { to { transform: translate(-85px, -70px) scale(1.12); } }
  @keyframes drift3 { to { transform: translate(110px, -55px) scale(1.22); } }

  /* content sits above the blobs */
  #slide1 h1, #slide1 .big-emoji, #slide1 .btn,
  .notebook, .tap-hint,
  #slide3 h2, #slide3 .sub, .stage, #blowCount,
  .placeholder-box, #slide5 h2, .gallery { position: relative; z-index: 2; }

  /* ---------- GENTLE FLOATING MOVEMENT ---------- */
  @keyframes floaty { from { transform: translateY(0) rotate(var(--r, 0deg)); } to { transform: translateY(-9px) rotate(var(--r, 0deg)); } }
  @keyframes noteFloat { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-16px) rotate(0.6deg); } }
  .notebook { --r: -1.2deg; animation: noteFloat 5.5s ease-in-out infinite alternate; }
  .stage { animation: floaty 6.5s ease-in-out infinite alternate; }
  .placeholder-box { animation: floaty 5.5s ease-in-out infinite alternate; }
  #slide3 h2, #slide5 h2, #slide1 h1 { animation: floaty 5s ease-in-out infinite alternate; }
  .gallery .photo { animation: floaty 4.6s ease-in-out infinite alternate; }
  .gallery .photo:nth-child(2) { animation-delay: .7s; }
  .gallery .photo:nth-child(3) { animation-delay: 1.3s; }
  .gallery .photo:nth-child(4) { animation-delay: 1.9s; }

  /* ---------- PROGRESS DOTS ---------- */
  .dots { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 20; }
  .dots span { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.45); transition: all .3s; }
  .dots span.on { background: #fff; transform: scale(1.3); box-shadow: 0 0 8px rgba(255,255,255,.8); }

  /* ---------- BUTTONS ---------- */
  .btn {
    border: none; cursor: pointer; font-family: 'Hind Siliguri', sans-serif; font-weight: 700;
    padding: 14px 34px; font-size: 1.05rem; border-radius: 50px;
    background: #fff; color: #d6336c;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    transition: transform .2s, box-shadow .2s, opacity .5s;
    user-select: none;
  }
  .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 26px rgba(0,0,0,.3); }
  .btn:active { transform: scale(.97); }
  .nav-btn { position: absolute; bottom: 26px; padding: 12px 28px; font-size: .95rem; z-index: 20; }
  .nav-back { left: 22px; }
  .nav-next { right: 22px; }
  .hidden-btn { opacity: 0; pointer-events: none; transform: translateY(15px); }
  .pop-in { animation: popIn .5s ease forwards; }
  @keyframes popIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* sound toggle */
  #soundToggle {
    position: fixed; top: 14px; right: 14px; z-index: 100;
    width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,.88); font-size: 1.25rem;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }

  /* ---------- SLIDE 1 ---------- */
  #slide1 { background: linear-gradient(135deg, #ff9a9e, #fecfef, #a18cd1, #fbc2eb); background-size: 300% 300%; animation: gradMove 10s ease infinite; }
  @keyframes gradMove { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  #slide1 .big-emoji { font-size: 5rem; animation: bounce 2s ease infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  #slide1 h1 { color: #fff; font-size: clamp(2rem, 7vw, 3.4rem); text-shadow: 0 4px 18px rgba(0,0,0,.25); margin: 10px 0 34px; text-align: center; }
  .balloon { position: absolute; font-size: 2.6rem; animation: floatUp 7s ease-in-out infinite; opacity: .9; z-index: 1; }
  @keyframes floatUp { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-26px) rotate(5deg); } }

  /* ---------- SLIDE 2 (NOTE) ---------- */
  #slide2 { background: linear-gradient(160deg, #ff5e8a, #ff8fb2, #ffc2d4, #ffe0ea); background-size: 250% 250%; animation: gradMove 12s ease infinite; }
  .notebook {
    position: relative; width: min(88vw, 520px); height: min(74vh, 640px);
    background: #fffdf5; border-radius: 6px 14px 14px 6px;
    box-shadow: 0 18px 44px rgba(120,0,50,.35);
    padding: 34px 30px 30px 58px;
    background-image: repeating-linear-gradient(#fffdf5 0, #fffdf5 calc(var(--lh, 31px) - 1px), #cfe4ff calc(var(--lh, 31px) - 1px), #cfe4ff var(--lh, 31px));
    background-position: 0 12px;
    cursor: pointer;
  }
  .notebook::before { /* red margin line */
    content: ''; position: absolute; top: 0; bottom: 0; left: 44px; width: 2px; background: rgba(255,90,90,.55);
  }
  .notebook::after { /* punched holes */
    content: ''; position: absolute; top: 26px; bottom: 26px; left: 13px; width: 16px;
    background-image: radial-gradient(circle 7px, #ffd9e6 6px, #e8a9c0 7px, transparent 8px);
    background-size: 16px 64px; background-repeat: repeat-y;
  }
  .note-title { font-size: 1.2rem; color: #d6336c; margin-bottom: 4px; line-height: 1.6; }
  #noteScroll { height: calc(100% - 40px); overflow: hidden; }
  #noteText { font-family: 'Hind Siliguri', sans-serif; font-size: var(--fs, 15px); line-height: var(--lh, 31px); color: #444; word-break: break-word; }
  #noteText .ln { min-height: var(--lh, 31px); }
  #noteText .w { opacity: 0; transition: opacity .45s ease; }
  #noteText .w.show { opacity: 1; }
  @media (max-width: 480px) {
    .notebook { padding: 30px 16px 20px 40px; }
    .notebook::before { left: 30px; }
    .notebook::after { left: 8px; }
  }
  .cursor { display: inline-block; width: 2px; height: 1.1em; background: #d6336c; vertical-align: -3px; animation: blink .7s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .tap-hint { margin-top: 14px; color: #fff; font-size: 1rem; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.35); font-family: 'Hind Siliguri', sans-serif; }

  /* ---------- SLIDE 3 (CANDLES) ---------- */
  #slide3 { background: linear-gradient(180deg, #2b1055, #7597de 130%); }
  #slide3 h2 { color: #fff; font-size: clamp(1.5rem, 5.5vw, 2.3rem); text-shadow: 0 3px 12px rgba(0,0,0,.4); margin-bottom: 6px; text-align: center; }
  #slide3 .sub { color: #fff; margin-bottom: 30px; text-align: center; font-size: 1.05rem; font-weight: 600; line-height: 1.6; font-family: 'Hind Siliguri', sans-serif; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .stage { display: flex; flex-direction: column; align-items: center; }
  .candles { display: flex; gap: clamp(14px, 5vw, 34px); align-items: flex-end; z-index: 3; }
  .candle { position: relative; width: 26px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .candle::after { content: ''; position: absolute; left: -14px; right: -14px; top: -20px; bottom: -6px; }
  .candle .body {
    width: 26px; height: 92px; border-radius: 6px 6px 4px 4px; position: relative;
    box-shadow: inset -5px 0 8px rgba(0,0,0,.18);
  }
  .candle .body::before { /* melted wax top */
    content: ''; position: absolute; top: -5px; left: 1px; right: 1px; height: 12px;
    background: rgba(255,255,255,.85); border-radius: 50%;
  }
  .candle:nth-child(1) .body { background: repeating-linear-gradient(45deg, #ff6b9d 0 9px, #fff 9px 18px); }
  .candle:nth-child(2) .body { background: repeating-linear-gradient(45deg, #4dabf7 0 9px, #fff 9px 18px); height: 108px; }
  .candle:nth-child(3) .body { background: repeating-linear-gradient(45deg, #ffd43b 0 9px, #fff 9px 18px); height: 98px; }
  .candle:nth-child(4) .body { background: repeating-linear-gradient(45deg, #69db7c 0 9px, #fff 9px 18px); height: 108px; }
  .candle:nth-child(5) .body { background: repeating-linear-gradient(45deg, #b197fc 0 9px, #fff 9px 18px); }
  .wick { width: 3px; height: 10px; background: #333; margin: 0 auto; border-radius: 2px; }
  @keyframes candleSway { from { transform: rotate(-2.2deg) translateY(0); } to { transform: rotate(2.2deg) translateY(-6px); } }
  .candle { transform-origin: 50% 100%; animation: candleSway 4s ease-in-out infinite alternate; }
  .candle:nth-child(1) { animation-duration: 3.6s; animation-delay: -0.4s; }
  .candle:nth-child(2) { animation-duration: 4.4s; animation-delay: -1.3s; }
  .candle:nth-child(3) { animation-duration: 3.9s; animation-delay: -2.1s; }
  .candle:nth-child(4) { animation-duration: 4.7s; animation-delay: -0.9s; }
  .candle:nth-child(5) { animation-duration: 4.1s; animation-delay: -1.8s; }
  /* flame — standing straight up, no tilt */
  .flame {
    width: 18px; height: 28px; margin: 0 auto -3px; position: relative;
    background: radial-gradient(circle at 50% 82%, #fff8c6 0%, #ffe066 30%, #ffb03a 55%, #ff7b33 78%, #ff5d3b 100%);
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    transform-origin: 50% 100%;
    transform: scale(0); opacity: 0;
    transition: transform .35s ease, opacity .35s ease;
    box-shadow: 0 0 24px 7px rgba(255,170,40,.55);
  }
  .flame::after { /* bright inner core */
    content: ''; position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%);
    width: 7px; height: 12px;
    background: radial-gradient(circle at 50% 80%, #ffffff, #ffe066);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; opacity: .95;
  }
  .candle.lit .flame { opacity: 1; transform: scale(1); animation: flick .18s infinite alternate ease-in-out; }
  @keyframes flick { from { transform: scale(1,1) rotate(-1.5deg); } to { transform: scale(1.05,1.13) rotate(1.5deg); } }
  .smoke {
    position: absolute; left: 50%; top: -34px; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(200,200,200,.8); transform: translateX(-50%); pointer-events: none;
    animation: smokeUp 1s ease-out forwards;
  }
  @keyframes smokeUp { to { transform: translate(-30%, -52px) scale(2.6); opacity: 0; } }
  .cake { margin-top: -2px; display: flex; flex-direction: column; align-items: center; z-index: 2; }
  .cake .layer1 { width: min(74vw, 320px); height: 52px; background: linear-gradient(#ff8fb2, #ff6b9d); border-radius: 12px; position: relative; }
  .cake .layer1::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 16px; background: #fff0f5; border-radius: 12px 12px 40% 40%; }
  .cake .layer2 { width: min(84vw, 370px); height: 56px; background: linear-gradient(#c77b4f, #a05a2c); border-radius: 12px; position: relative; }
  .cake .layer2::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 15px; background: #ffdf6b; border-radius: 12px 12px 40% 40%; }
  .cake .plate { width: min(92vw, 420px); height: 14px; background: linear-gradient(#e9ecef, #adb5bd); border-radius: 50%; margin-top: 4px; }
  #blowCount { color: #fff; margin-top: 24px; font-size: 1.05rem; font-weight: 600; font-family: 'Hind Siliguri', sans-serif; background: rgba(255,255,255,.2); padding: 8px 20px; border-radius: 30px; }

  /* ---------- SLIDE 4 (CAKE CUTTING - EMPTY FOR NOW) ---------- */
  #slide4 { background: linear-gradient(150deg, #f6d365, #fda085, #fbc2eb); background-size: 250% 250%; animation: gradMove 12s ease infinite; }
  .placeholder-box {
    width: min(86vw, 480px); min-height: 300px;
    border: 3px dashed rgba(255,255,255,.85); border-radius: 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    color: #fff; text-align: center; padding: 26px;
    background: rgba(255,255,255,.12);
  }
  .placeholder-box .big { font-size: 3.4rem; }
  .placeholder-box p { font-size: 1.05rem; text-shadow: 0 1px 5px rgba(0,0,0,.2); }

  /* ---------- SLIDE 4 SCENE: background fades in, cake falls, knife comes in ---------- */
  #slide4 { transition: opacity 1.2s ease, transform 1.2s ease, visibility 1.2s; }
  .scene4 { position: relative; z-index: 2; width: min(94vw, 580px); height: min(76vh, 580px); display: flex; align-items: center; justify-content: center; }
  .scene4 .cake-drop { opacity: 0; }
  .cake3d { width: min(94vw, 580px); height: min(76vh, 580px); }
  .cake3d canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .cut-hint { position: absolute; left: 0; right: 0; top: 11%; padding: 0 24px; z-index: 3; color: #fff; font-size: 1.05rem; font-weight: 600; font-family: 'Hind Siliguri', sans-serif; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,.35); opacity: 0; transition: opacity .5s ease; }
  .cut-hint.on { opacity: 1; }
  .scene4 .knife { position: absolute; right: 2%; bottom: 6%; font-size: clamp(110px, 26vw, 170px); opacity: 0; transform: translate(60vw, 70vh) rotate(-60deg) scaleX(-1); }
  #slide4.play .cake-drop { animation: cakeDrop 1.1s cubic-bezier(.35,1.2,.5,1) 1.1s forwards; }
  #slide4.play .knife { animation: knifeIn 1.2s cubic-bezier(.2,.8,.3,1) 2.8s forwards; }
  @keyframes cakeDrop {
    0%   { opacity: 1; transform: translateY(-120vh); }
    65%  { opacity: 1; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes knifeIn {
    0%   { opacity: 1; transform: translate(60vw, 70vh) rotate(-60deg) scaleX(-1); }
    100% { opacity: 1; transform: translate(-70%, -14%) rotate(-28deg) scaleX(-1); }
  }

  /* ---------- SLIDE 5 (PHOTOS - EMPTY FOR NOW) ---------- */
  #slide5 { background: linear-gradient(160deg, #30cfd0, #a18cd1, #fbc2eb); background-size: 250% 250%; animation: gradMove 14s ease infinite; }
  #slide5 h2 { color: #fff; font-size: clamp(1.6rem, 6vw, 2.4rem); text-shadow: 0 3px 12px rgba(0,0,0,.3); margin-bottom: 22px; }
  .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: min(90vw, 560px); }
  .photo {
    aspect-ratio: 4/5; border-radius: 16px; overflow: hidden; position: relative;
    background: rgba(255,255,255,.2); border: 3px solid rgba(255,255,255,.75);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: .95rem; text-align: center; padding: 10px;
    background-size: cover; background-position: center;
    user-select: none; -webkit-user-select: none;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; user-select: none; }

  /* ---------- AMBIENT LAYERS: falling flowers/balloons + background shadows ---------- */
  .falls, .deco { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .falls { z-index: 1; }
  .deco { z-index: 0; }
  .falls span { position: absolute; top: 0; opacity: .85; animation: driftDown linear infinite; }
  @keyframes driftDown {
    0%   { transform: translate(0, -8vh) rotate(0deg); }
    50%  { transform: translate(22px, 50vh) rotate(180deg); }
    100% { transform: translate(-14px, 108vh) rotate(360deg); }
  }
  .deco span { position: absolute; filter: brightness(0); opacity: .13; animation: decoSway 9s ease-in-out infinite alternate; }
  @keyframes decoSway { from { transform: translate(0,0) rotate(-6deg); } to { transform: translate(12px,-10px) rotate(6deg); } }

  /* ---------- SLIDE 1 -> 2 ENTRY: background blurs in, then the notebook slides in from the right ---------- */
  @keyframes bgUnblur { from { filter: blur(18px); opacity: 0; } 35% { opacity: 1; } to { filter: blur(0); opacity: 1; } }
  @keyframes noteSlideIn { from { translate: 110vw 0; } to { translate: 0 0; } }
  #slide2.enter { animation: bgUnblur 1.8s ease-out both; }
  #slide2.enter .notebook { animation: noteFloat 5.5s ease-in-out infinite alternate, noteSlideIn 1.1s cubic-bezier(.2,.8,.2,1) 1.9s both; }

  /* ---------- SLIDE 2 -> 3 TRANSITION ---------- */
  @keyframes noteOut { to { transform: translateY(-60px) rotate(8deg) scale(.7); opacity: 0; } }
  .notebook.note-out { animation: noteOut 1.3s cubic-bezier(.4,0,.6,1) forwards; }
  @keyframes circleWipe { from { clip-path: circle(0% at 50% 58%); } to { clip-path: circle(150% at 50% 58%); } }
  /* 4 -> 5 entry: slide 5 grows from small to full size */
  @keyframes zoomInFromBack { from { transform: scale(.35); opacity: 0; } 60% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
  #slide5.enter5 { animation: zoomInFromBack 1.2s cubic-bezier(.3,.9,.3,1) both; }

  /* 2 -> 3 entry: background unblurs, cake grows from small, candles drop from the top, then flames light */
  #slide3.enter3 { animation: bgUnblur 1.8s ease-out both; }
  #slide3.enter3 .cake { animation: cakeGrow 1s cubic-bezier(.3,1.2,.5,1) 1.9s both; }
  #slide3.enter3 .candles { animation: candleDrop 1.2s cubic-bezier(.3,.1,.4,1.1) 3s both; }
  @keyframes cakeGrow { from { transform: scale(.12); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes candleDrop { 0% { transform: translateY(-110vh); } 75% { transform: translateY(12px); } 100% { transform: translateY(0); } }
  #slide3 { transition: opacity 1.4s ease, transform 1.4s ease, visibility 1.4s; }
  .deco.deco-s3 span { opacity: .2; }

  /* ---------- SLIDE 5 PHOTO STACK: photos on top of each other, tap to change ---------- */
  .stack { position: relative; z-index: 2; width: min(80vw, 320px); aspect-ratio: 4/5; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .stack .photo { position: absolute; inset: 0; transition: transform .6s cubic-bezier(.3,.9,.3,1), opacity .6s ease; font-size: 1.1rem; font-weight: 600; box-shadow: 0 14px 32px rgba(40,0,70,.35); }
  .stack .photo { border: none; padding: 14px; box-sizing: border-box; border-radius: 4px; color: #6a3a66; }
  .stack .photo:nth-child(1) { background: linear-gradient(135deg, #ff9a9e, #fecfef) content-box, #fff; }
  .stack .photo:nth-child(2) { background: linear-gradient(135deg, #a1c4fd, #c2e9fb) content-box, #fff; }
  .stack .photo:nth-child(3) { background: linear-gradient(135deg, #fbc2eb, #a6c1ee) content-box, #fff; }
  .stack .photo:nth-child(4) { background: linear-gradient(135deg, #fdcbf1, #e6dee9) content-box, #fff; }
  .stack .photo:nth-child(5) { background: linear-gradient(135deg, #fad0c4, #ffd1ff) content-box, #fff; }
  .stack canvas { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .stack { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

  .stack-hint { margin-top: 18px; color: #fff; font-size: 1rem; font-weight: 600; font-family: 'Hind Siliguri', sans-serif; text-shadow: 0 2px 8px rgba(0,0,0,.35); text-align: center; }

  /* ---------- CONFETTI ---------- */
  .confetti { position: fixed; top: -12px; z-index: 50; pointer-events: none; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }
</style>
</head>
<body>

<button id="soundToggle" title="Sound on / off">🔊</button>

<!-- ================= SLIDE 1 ================= -->
<section class="slide active" id="slide1">
  <div class="blobs"><i></i><i></i><i></i><i></i></div>
  <span class="balloon" style="left:8%;  top:12%;">🎈</span>
  <span class="balloon" style="right:10%; top:18%; animation-delay:1.2s;">🎈</span>
  <span class="balloon" style="left:14%; bottom:14%; animation-delay:.6s;">🎉</span>
  <span class="balloon" style="right:15%; bottom:20%; animation-delay:1.8s;">🎊</span>
  <div class="big-emoji">🎂</div>
  <h1>A Special Day Is Here!</h1>
  <button class="btn" onclick="goTo(2)">Get Started</button>
</section>

<!-- ================= SLIDE 2 ================= -->
<section class="slide" id="slide2">
  <div class="blobs"><i></i><i></i><i></i><i></i></div>
  <div class="dots"></div>
  <div class="notebook" id="notebook" title="Tap to read instantly">
    <div class="note-title">💌 A Note For You</div>
    <div id="noteScroll"><div id="noteText"></div></div>
  </div>
  <button class="btn nav-btn nav-back" onclick="goTo(1)">⬅ BACK</button>
  <button class="btn nav-btn nav-next hidden-btn" id="nextBtn2" onclick="goTo(3)">NEXT ➡</button>

    const prev = current;
    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
    document.getElementById('slide' + n).classList.add('active');
    current = n;

  document.querySelectorAll('.dots').forEach(d => {

  /* =====================================================

  let actx = null, master = null, sfxOut = null, muted = false, tunePlaying = false;

  let musicBus = null, noiseBuf = null, musicComp = null;
  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 1;
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.25;
      master.connect(actx.destination);
      /* music: compressed so it stays even */
      musicComp = actx.createDynamicsCompressor();
      musicComp.threshold.value = -18; musicComp.ratio.value = 3; musicComp.attack.value = 0.005; musicComp.release.value = 0.25;
      musicComp.connect(master);
      /* sound effects: own louder path, not squashed by the music compressor */
      sfxOut = actx.createGain(); sfxOut.gain.value = 2.5;
      sfxOut.connect(master);
      document.addEventListener('visibilitychange', () => {
        if (actx && !document.hidden && actx.state === 'suspended') actx.resume();
      });
      tunePlaying = true; startMusicOnce();
    } catch (e) { /* audio not available */ }
  }
  window.addEventListener('pointerdown', initAudio);

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfxOut);
    o.start(t); o.stop(t + dur + 0.05);

    const g = actx.createGain();

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(out);
    src.start(t, Math.random() * 0.5, dur);
  }

  function pianoNote(m, when, vol, decay) {
    if (!actx || !musicBus) return;
    vol = vol || 0.16; decay = decay || 1.4;
    const f = mf(m), t = when;
    [[1, 'triangle', 1], [2, 'sine', .45], [3, 'sine', .18], [4, 'sine', .07]].forEach(function (h) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = h[1]; o.frequency.value = f * h[0];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * h[2], t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay * (h[0] === 1 ? 1 : 0.6));
      o.connect(g); g.connect(musicBus);
      o.start(t); o.stop(t + decay + 0.1);
    });
    noiseHit(t, 0.03, 3200, 0.04);
  }

  function stringNote(m, when, dur) {
    if (!actx) return;
    const f = mf(m), t = when;
    const flt = actx.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 850;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.026, t + 0.9);
    g.gain.setValueAtTime(0.026, Math.max(t + 0.9, t + dur - 0.7));
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    flt.connect(g); g.connect(musicBus);
    [-6, 6].forEach(function (det) {
      const o = actx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
      o.connect(flt); o.start(t); o.stop(t + dur + 0.1);
    });
  }

  /* Lookahead scheduler: notes are placed on the audio clock ~0.4s early,
     so the melody plays smoothly with no stutter or gaps. */
  let barIdx = 0, musicStarted = false, loopSrc = null;
  function scheduleBar(b, t0) {
    const ch = CHORDS[CHSEQ[b]];
    const barDur = BAR_BEATS * BEAT;
    ch.pad.forEach(m => stringNote(m, t0, barDur + 0.15));              /* strings pad */
    pianoNote(ch.bass, t0, 0.12, 1.6);                                 /* soft bass */
    pianoNote(ch.bass + 7, t0 + 2 * BEAT, 0.07, 1.2);
    const pat = [0, 1, 2, 1, 0, 1, 2, 1];                              /* gentle arpeggio */
    for (let i = 0; i < 8; i++) pianoNote(ch.tones[pat[i]] + 12, t0 + i * BEAT / 2, 0.045, 0.9);
    let pos = 0;                                                       /* piano melody */
    MELODY[b].forEach(function (nd) {
      pianoNote(nd[0], t0 + pos * BEAT, 0.17, Math.max(1.1, nd[1] * BEAT * 1.4));
      pos += nd[1];
    });
  }
  /* The whole 8-bar melody is rendered ONCE into an AudioBuffer (reverb included)
     and then looped by the audio thread itself. Nothing is scheduled on the page's
     main thread any more, so scrolling, animations or a busy phone can't make it stutter. */
  const LOOP_SEC = CHSEQ.length * BAR_BEATS * BEAT;

  /* builds the reverb bus + noise buffer for any AudioContext (live or offline) */
  function setupGraph(ctx, dest) {
    actx = ctx;
    const sr = ctx.sampleRate;
    const nb = ctx.createBuffer(1, sr, sr), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    noiseBuf = nb;
    const len = Math.floor(sr * 1.6), ir = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const ch = ir.getChannelData(c);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    const bus = ctx.createGain(); bus.gain.value = 0.85;
    const verb = ctx.createConvolver(); verb.buffer = ir;
    const vg = ctx.createGain(); vg.gain.value = 0.2;
    bus.connect(dest); bus.connect(verb); verb.connect(vg); vg.connect(dest);
    musicBus = bus;
  }

  /* Fallback: plays the same melody live, scheduled ahead on the audio clock */
  let liveNext = 0, liveTimer = null, liveBar = 0;
  function startLive() {
    if (liveTimer || !actx) return;
    setupGraph(actx, musicComp);
    liveNext = actx.currentTime + 0.15;
    liveTimer = setInterval(() => {
      if (!actx || actx.state !== 'running') return;
      if (liveNext < actx.currentTime) liveNext = actx.currentTime + 0.1;
      while (liveNext < actx.currentTime + 1.2) {
        scheduleBar(liveBar, liveNext);
        liveBar = (liveBar + 1) % CHSEQ.length;
        liveNext += BAR_BEATS * BEAT;
      }
    }, 150);
  }

  /* Main: render the 8-bar loop once, then loop it on the audio thread */
  function renderLoop() {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return Promise.reject(new Error('no OfflineAudioContext'));
    const live = actx, sr = live.sampleRate, tail = 3;
    const off = new OAC(2, Math.ceil(sr * (LOOP_SEC + tail)), sr);
    const saved = { actx: actx, musicBus: musicBus, noiseBuf: noiseBuf };
    try {
      setupGraph(off, off.destination);
      for (let b = 0; b < CHSEQ.length; b++) scheduleBar(b, b * BAR_BEATS * BEAT + 0.05);
    } finally {
      actx = saved.actx; musicBus = saved.musicBus; noiseBuf = saved.noiseBuf;
    }
    return new Promise((resolve, reject) => {
      try {
        const r = off.startRendering();
        if (r && typeof r.then === 'function') r.then(resolve, reject);
        else off.oncomplete = e => resolve(e.renderedBuffer);
      } catch (err) { reject(err); }
    }).then(full => {
      const L = Math.floor(sr * LOOP_SEC), T = full.length - L;
      const out = live.createBuffer(2, L, sr);
      for (let c = 0; c < 2; c++) {
        const src = full.getChannelData(c), dst = out.getChannelData(c);
        for (let i = 0; i < L; i++) dst[i] = src[i];
        for (let i = 0; i < T; i++) dst[i] += src[L + i];
      }
      return out;
    });
  }

  function startMusicOnce() {
    if (musicStarted || !actx) return;
    musicStarted = true;
    startLive();                       /* melody starts right away, from the first tap */
    renderLoop().then(buf => {
      if (!actx) return;
      /* hand over to the seamless loop exactly on the next bar, at the same musical position */
      const when = Math.max(liveNext, actx.currentTime + 0.05);
      const offset = (liveBar % CHSEQ.length) * BAR_BEATS * BEAT;
      loopSrc = actx.createBufferSource();
      loopSrc.buffer = buf; loopSrc.loop = true;
      loopSrc.connect(musicComp);
      loopSrc.start(when, offset);
      clearInterval(liveTimer); liveTimer = null;
    }).catch(err => {
      console.warn('Music render failed, staying on live playback:', err);
    });
  }

  function sfxType() { /* clear pencil-on-paper scratching sound */

    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    for (let i = 1; i <= 6; i++) g.gain.linearRampToValueAtTime(0.10 + Math.random() * 0.09, t + dur * i / 6);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(sfxOut);

    const src2 = actx.createBufferSource(); src2.buffer = buf;
    const lf = actx.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 700;
    const g2 = actx.createGain(); g2.gain.value = 0.035;
    src2.connect(lf); lf.connect(g2); g2.connect(sfxOut);

    bp.frequency.setValueAtTime(1500, t);
    bp.frequency.exponentialRampToValueAtTime(320, t + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.28, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(sfxOut);
    src.start(t); src.stop(t + dur);
  }

  let noteDone = false, noteTimers = [];
  function buildNote() {
    const el = document.getElementById('noteText');
    el.innerHTML = '';

  /* shrink font (and ruled-line spacing together) until the whole note fits, no scrolling */
  function fitNote() {
    const box = document.getElementById('notebook');
    const wrap = document.getElementById('noteScroll');
    const el = document.getElementById('noteText');
    let fs = 15;
    const apply = f => {
      box.style.setProperty('--fs', f + 'px');
      box.style.setProperty('--lh', Math.round(f * 2.05) + 'px');
    };
    apply(fs);
    while (fs > 8 && el.offsetHeight > wrap.clientHeight) { fs -= 0.5; apply(fs); }
  }
  function startNote() {
    if (noteDone) { showAllNote(); showNext2(); return; }

    words.forEach((w, i) => noteTimers.push(setTimeout(() => w.classList.add('show'), 300 + i * gap)));
    noteTimers.push(setTimeout(finishNote, 300 + words.length * gap + 400));

  function finishNote() {

  /* ---------- PHOTOS: decrypt in the browser and draw to a canvas (no <img> to long-press) ---------- */
  const PHOTO_KEY = 'bandhupi-2026';   /* must match KEY in make_photos.py */
  const KEYB = new TextEncoder().encode(PHOTO_KEY);
  function decodePhoto(b64) {
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) ^ KEYB[i % KEYB.length];
    return out;
  }
  /* draw one decrypted photo into its frame; tries blob: first, then data: (some phone browsers refuse blob images) */
  function showPhoto(card, i, bytes) {
    const draw = img => {
      const cv = document.createElement('canvas');
      cv.width = 600; cv.height = 750;
      const ctx = cv.getContext('2d');
      const r = Math.max(cv.width / img.width, cv.height / img.height);
      const dw = img.width * r, dh = img.height * r;
      ctx.drawImage(img, (cv.width - dw) / 2, (cv.height - dh) / 2, dw, dh);
      card.textContent = '';
      card.appendChild(cv);
    };
    const tryLoad = (src, onFail) => {
      const img = new Image();
      img.onload = () => draw(img);
      img.onerror = onFail;

            const e = easeIO((el - 700) / 600);
            const saw = Math.sin(e * Math.PI * 6) * 0.14 * (1 - e * 0.5);   /* gentle sawing, like a real cut */
            kTf = { rz: CUT_RZ + Math.sin(e * Math.PI * 6) * 0.05, yaw: -A1, t: [Math.cos(A1) * (1.6 + saw), L(3.7, 1.6, e), Math.sin(A1) * (1.6 + saw)] };
          }
        } else if (el < CUT_T + 400) {
          const e = easeIO((el - CUT_T) / 400);
          kTf = { rz: CUT_RZ, yaw: -A1, t: [Math.cos(A1) * 1.6, L(1.6, 3.9, e), Math.sin(A1) * 1.6] };
        }
      }
      /* the knife is the real 🔪 emoji itself, drawn on the canvas, so it looks exactly like 🔪 */
      if (kTf) {
        const kv = toView(xf([0, 0.6, 0], kTf, true));
        if (kv[2] > 0.2) {
          const kp = project(kv);
          const ka = project(toView(xf([0, 1.6, 0], kTf, true)));
          const kb = project(toView(xf([0, -0.4, 0], kTf, true)));
          const axisLen = Math.hypot(ka[0] - kb[0], ka[1] - kb[1]);
          const size = Math.min(W * 0.6, Math.max(axisLen * 1.9, focal() * 2.9 / kv[2]));
          const rot = Math.atan2(ka[1] - kb[1], ka[0] - kb[0]) - Math.PI * 0.25;
          list.push({ z: kv[2], draw() {
            ctx.save();
            ctx.translate(kp[0], kp[1]);
            ctx.rotate(rot);
            ctx.font = size + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('\u{1F52A}', 0, 0);
            ctx.restore();
          } });
        }
      }

      bg.sort((a, b) => b.z - a.z);
      list.sort((a, b) => b.z - a.z);
      if (serving) {
        /* main cake goes blurry into the background, the slice stays sharp in front */
        ctx.save();
        ctx.filter = 'blur(4px)';
        ctx.globalAlpha = 0.8;
        bg.forEach(item => item.draw());
        ctx.restore();
        const sc = project(toView([PLATE_CENTRE[0] + SERVE_D[0] * serveE, 0.4 + SERVE_D[1] * serveE, PLATE_CENTRE[2] + SERVE_D[2] * serveE]));
        const grd = ctx.createRadialGradient(sc[0], sc[1], 10, sc[0], sc[1], W * 0.42);
        grd.addColorStop(0, 'rgba(255,255,255,0.35)');
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H);
        list.forEach(item => item.draw());
      } else {
        const all = bg.concat(list);
        all.sort((a, b) => b.z - a.z);
        all.forEach(item => item.draw());
      }
    }
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
